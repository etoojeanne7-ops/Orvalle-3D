name: Orvalle Godot validation

on:
  push:
    paths:
      - "OrvalleNative/**"
      - ".github/workflows/orvalle-godot-check.yml"
  pull_request:
    paths:
      - "OrvalleNative/**"
      - ".github/workflows/orvalle-godot-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-project:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Confirm project files exist
        run: |
          test -f OrvalleNative/project.godot
          test -f OrvalleNative/scenes/Main.tscn
          test -f OrvalleNative/tests/terrain_parity.gd

      - name: Install Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false

      - name: Import and parse project
        run: godot --headless --path OrvalleNative --editor --quit

      - name: Verify terrain parity fixtures
        run: godot --headless --path OrvalleNative --script res://tests/terrain_parity.gd

      - name: Run scene startup smoke test
        run: godot --headless --path OrvalleNative --quit-after 8
