name: Orvalle Godot validation

on:
  push:
    paths:
      - "OrvalleNative/**"
      - "Orvalle-3D-CI-Prepared.zip"
      - ".github/workflows/orvalle-godot-check.yml"
  pull_request:
    paths:
      - "OrvalleNative/**"
      - "Orvalle-3D-CI-Prepared.zip"
      - ".github/workflows/orvalle-godot-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-project:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate native project (direct import or uploaded archive)
        id: project
        shell: bash
        run: |
          if [ -f OrvalleNative/project.godot ]; then
            echo "path=OrvalleNative" >> "$GITHUB_OUTPUT"
          elif [ -f Orvalle-3D-CI-Prepared.zip ]; then
            mkdir -p /tmp/orvalle-import
            unzip -q Orvalle-3D-CI-Prepared.zip -d /tmp/orvalle-import
            if [ -f /tmp/orvalle-import/orvalle-workspace/OrvalleNative/project.godot ]; then
              echo "path=/tmp/orvalle-import/orvalle-workspace/OrvalleNative" >> "$GITHUB_OUTPUT"
            else
              echo "Archive does not contain the expected OrvalleNative/project.godot path."
              exit 1
            fi
          else
            echo "No OrvalleNative/project.godot or Orvalle-3D-CI-Prepared.zip found."
            exit 1
          fi

      - name: Install Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false

      - name: Import and parse project
        run: godot --headless --path "${{ steps.project.outputs.path }}" --editor --quit

      - name: Verify terrain parity fixtures
        run: godot --headless --path "${{ steps.project.outputs.path }}" --script res://tests/terrain_parity.gd

      - name: Run scene startup smoke test
        run: godot --headless --path "${{ steps.project.outputs.path }}" --quit-after 8
