name: Orvalle character asset gate

on:
  workflow_dispatch:
  push:
    paths:
      - "OrvalleNative/characters/**"
      - "tools/validate_character_glb.py"
      - "tools/test_validate_character_glb.py"
      - ".github/workflows/character-realism-gate.yml"
  pull_request:
    paths:
      - "OrvalleNative/characters/**"
      - "tools/validate_character_glb.py"
      - "tools/test_validate_character_glb.py"
      - ".github/workflows/character-realism-gate.yml"

permissions:
  contents: read

jobs:
  validate-character-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check Python version
        run: python3 --version
      - name: Test validator logic independently of production assets
        working-directory: tools
        run: python3 -m unittest -v test_validate_character_glb.py
      - name: Validate production character assets
        run: python3 tools/validate_character_glb.py OrvalleNative/characters
