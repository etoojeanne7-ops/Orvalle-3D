name: Orvalle character asset gate

on:
  workflow_dispatch:
  push:
    paths:
      - "OrvalleNative/characters/**"
      - "tools/validate_character_glb.py"
      - ".github/workflows/character-realism-gate.yml"
  pull_request:
    paths:
      - "OrvalleNative/characters/**"
      - "tools/validate_character_glb.py"
      - ".github/workflows/character-realism-gate.yml"

permissions:
  contents: read

jobs:
  validate-character-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check required Python version
        run: python3 --version
      - name: Validate GLB structure and minimum required features
        run: python3 tools/validate_character_glb.py OrvalleNative/characters
